services:
  - type: web
    name: the-alibi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from alibi.audio.manager import ensure_all_audio_assets; ensure_all_audio_assets('assets/audio')"
    startCommand: python run.py --web --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_KEY
        sync: false
